# ---------------------------------------------------------------------------
# Copiar a: .github/workflows/claude.yml del repo destino.
#
# Requisitos:
#   1. El secret CLAUDE_CODE_OAUTH_TOKEN en ese repo.
#   2. Este archivo DEBE estar mergeado en la rama por defecto (main). Los
#      eventos issue_comment / issues solo ejecutan workflows de esa rama.
#
# Que hace: responde cuando escribes @claude en un comentario, un issue,
# un review o un comentario de review.
# ---------------------------------------------------------------------------
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    # `assigned` se dispara al asignar a cualquiera; solo corre si el
    # cuerpo/titulo del issue ya contenia @claude. Quitalo si molesta.
    types: [opened, assigned]

jobs:
  claude:
    # Los permisos se declaran ACA. Un workflow reutilizable solo puede recortar
    # los permisos del que lo llama, nunca ampliarlos: si este bloque falta, el
    # job hereda el default del repo (normalmente solo lectura) y Claude no
    # podra comentar ni commitear.
    permissions:
      contents: write        # crear ramas y commitear los cambios que le pidas
      pull-requests: write
      issues: write
      id-token: write
      actions: read          # leer resultados de CI de los PRs

    uses: Dayroot/.github/.github/workflows/claude-mention.yml@v1
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # with:
    #   trigger_phrase: '@claude'
    #   allowed_associations: 'OWNER,MEMBER,COLLABORATOR'   # '' = no filtrar
    #   model: 'claude-opus-5'
